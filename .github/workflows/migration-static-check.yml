name: Migration static check

on:
  push:
    branches: [legacy-R]
  pull_request:
    branches: [legacy-R]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Compile Python utilities
        run: |
          python -m compileall -q python/birdbrain_migrate
          python -m compileall -q python/birdbrain_finalizer
      - name: Run round finalizer regressions
        run: |
          python python/birdbrain_finalizer/test_core.py
          python python/birdbrain_finalizer/test_db_writer.py
          python python/birdbrain_finalizer/test_udisc.py
          python python/birdbrain_finalizer/test_udisc_import.py
          python python/birdbrain_finalizer/test_native_round_preview.py

  r-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse database Shiny R files
        shell: Rscript {0}
        run: |
          files <- c(
            "shiny-db/R/db.R",
            "shiny-db/server.R",
            "shiny-db/ui.R",
            "shiny-db/run_dev.R",
            "shiny-db/smoke_test.R"
          )
          for (path in files) {
            parse(file = path)
            cat("PASS", path, "\n")
          }
